name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly build, E2E & benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Test suites
        run: npm test

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Real VS Code host E2E smoke
        run: xvfb-run -a npm run test:e2e:host

      - name: Performance benchmark (500K)
        run: npm run benchmark:500k

      - name: Package Nightly VSIX
        env:
          NODE_ENV: production
        run: |
          npm run package:nightly
          cp dist/*.vsix dist/cts-git-graph-nightly.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v7
        with:
          name: git-graph-nightly-vsix
          path: dist/*.vsix

      - name: Upload benchmark report
        uses: actions/upload-artifact@v7
        with:
          name: git-graph-benchmark-report
          path: |
            docs/benchmark-report.json
            docs/benchmark-report.md

      - name: Get build metadata
        id: meta
        run: |
          echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update Nightly Git Tag
        run: |
          git tag -f nightly HEAD
          git push -f origin nightly

      - name: Create or Update Nightly GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: 'Git Graph Nightly Build (${{ steps.meta.outputs.date }})'
          prerelease: true
          make_latest: false
          files: |
            dist/cts-git-graph-nightly.vsix
            dist/*.vsix
            docs/benchmark-report.md
          body: |
            ## Git Graph Nightly Build 🌙

            Automated pre-release build compiled from the latest `master` branch.

            - **Commit:** [`${{ steps.meta.outputs.short_sha }}`](https://github.com/thaoanhhaa1/git-graph/commit/${{ github.sha }})
            - **Build Timestamp:** `${{ steps.meta.outputs.date }}`
            - **Quality Gates:** 100% test pass (Unit, Integration, VS Code host E2E suite, 500K-commit benchmark).

            ### How to Install
            1. Download [`cts-git-graph-nightly.vsix`](https://github.com/thaoanhhaa1/git-graph/releases/download/nightly/cts-git-graph-nightly.vsix) below.
            2. Open VS Code.
            3. Open the Extensions sidebar (`Ctrl+Shift+X` on Windows/Linux or `Cmd+Shift+X` on macOS).
            4. Click the `...` (More Actions) menu at the top-right of the Extensions panel and select **Install from VSIX...**
            5. Select the downloaded `.vsix` file and reload VS Code when prompted.

      - name: Check Marketplace token
        id: marketplace-token
        run: echo "available=${{ secrets.VSCE_PAT != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish Pre-Release to Visual Studio Marketplace
        if: steps.marketplace-token.outputs.available == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pre-release --no-dependencies --packagePath dist/*.vsix
